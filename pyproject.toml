# File: pyproject.toml
[project]
name = "pre-commit-context-header"
dynamic = ["version"]
description = "A universal pre-commit utility that enforces file path headers to ensure AI coding agents and LLMs always maintain context."
license = "MIT"
authors = [{ name = "meek2100", email = "meek2100@users.noreply.github.com" }]
requires-python = ">=3.10"
dependencies = []

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/meek2100/pre-commit-context-header"
Repository = "https://github.com/meek2100/pre-commit-context-header"
Issues = "https://github.com/meek2100/pre-commit-context-header/issues"
Changelog = "https://github.com/meek2100/pre-commit-context-header/releases"

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "pre-commit>=4.6.2",
    "mypy==2.4.0",
    "pyright>=1.1.414",
    "types-setuptools>=80.9.0",
    "types-PyYAML>=6.0.12",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "pre-commit>=4.6.2",
    "mypy==2.4.0",
    "pyright>=1.1.414",
    "types-setuptools>=80.9.0",
    "types-PyYAML>=6.0.12",
]

[tool.uv]
package = true
default-groups = ["dev"]

[project.scripts]
context-headers = "context_headers.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
context_headers = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "context_headers.__version__" }

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
exclude = ["build/"]

[[tool.mypy.overrides]]
module = ["pytest"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["src", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "build", "dist"]
# Ensure we strictly check imports; requires dependencies in env
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "--cov=context_headers --cov-report=term-missing --cov-fail-under=100"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
