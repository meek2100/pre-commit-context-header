# File: .github/workflows/release.yaml
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  gh_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true

  pypi_publish:
    name: Publish to PyPI
    needs: gh_release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for Trusted Publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/p/pre-commit-context-header
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Verify Versions
        # This step ensures the Git Tag matches __version__ in __init__.py.
        # pyproject.toml derives version dynamically via [tool.setuptools.dynamic].
        run: |
          uv run python -c '
          import sys
          from pathlib import Path
          import re

          # 1. Get Tag Version from Environment
          ref_name = "${{ github.ref_name }}"  # e.g., "v0.1.1"
          if not ref_name.startswith("v"):
              print(f"Error: Ref {ref_name} is not a version tag.")
              sys.exit(1)
          tag_ver = ref_name[1:]

          # 2. Get Init Version
          init_content = Path("src/context_headers/__init__.py").read_text(encoding="utf-8")
          match = re.search(r"__version__\s*=\s*\"([^\"]+)\"", init_content)
          if not match:
              print("Error: Could not find __version__ in src/context_headers/__init__.py")
              sys.exit(1)
          init_ver = match.group(1)

          print(f"Verifying versions:\n  Tag:       {tag_ver}\n  Init:      {init_ver}")

          if tag_ver != init_ver:
              print("::error::Version mismatch detected! Ensure git tag and __init__.py match.")
              sys.exit(1)
          '

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # NOTE: By default this uses Trusted Publishing (OIDC).
        # If you prefer using a token, uncomment the line below and add the secret:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
