# File: .github/workflows/pre-commit-sync.yaml
name: Dependabot Pre-Commit Sync

on:
  pull_request:
    types: [opened, synchronize]
    branches: ["dependabot/**"]
    paths: ["pyproject.toml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit autoupdate
        run: uv run pre-commit autoupdate

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(deps): sync pre-commit hooks"
          files: ".pre-commit-config.yaml"
          commit_author: Dependabot <dependabot@users.noreply.github.com>
